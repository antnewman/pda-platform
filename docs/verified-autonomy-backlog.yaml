# ─────────────────────────────────────────────────────────────────────────
# PHASE 2 — Foundations (8 issues)
# ─────────────────────────────────────────────────────────────────────────

foundations:
  - id: A1
    title: "L8 foundation — Generic AuditChain primitive"
    layer: 8
    paper_section: "§11.3"
    evidence_tier: "Industry standard (C2PA, Certificate Transparency, ISO 42001). Mature, legally mandated (EU AI Act Article 50)."
    evidence_tier_label: "evidence-tier-strongest"
    scope: |
      Extract `AuditChain` and `AuditEntry` from `packages/pm-data-tools/src/pm_data_tools/integrations/nista/audit.py` into a generic module at `packages/pm-data-tools/src/pm_data_tools/audit/chain.py`. The NISTA-specific logger becomes a thin wrapper around the generic primitive.

      - Add HMAC-SHA256 signing support (the existing dataclass supports it; surface as a constructor parameter).
      - Add canonical-JSON serialisation (deterministic key ordering) per paper §11.3.
      - Add `verify()` and `export_json()` / `from_json()` methods matching the paper's reference implementation.
      - Add `compute_consistency_hash(decision_dict)` helper for Layer 8's structural-consistency variant (§11.4).

      Tests: hash chain integrity under tampering; HMAC verification with right/wrong keys; canonical serialisation determinism; consistency hash stability across structurally-identical inputs.
    branch: "feat/L8-generic-audit-chain"
    depends_on: []

  - id: A2
    title: "L5 foundation — Output-guardrail policy engine"
    layer: 5
    paper_section: "§8.3"
    evidence_tier: "Industry standard. Mature, widely deployed. No dependencies."
    evidence_tier_label: "evidence-tier-strongest"
    scope: |
      New module `packages/pm-mcp-servers/src/pm_mcp_servers/_guardrails/` (underscore to mark internal). Implements the paper's §8.3 reference architecture.

      - `Rule` dataclass (name, description, severity, condition callable).
      - `Severity` enum (`BLOCK`, `WARN`, `UNKNOWN`, `INFO`).
      - `Verdict` enum (`APPROVED`, `FLAGGED`, `REJECTED`).
      - `evaluate(output_dict, policy: list[Rule]) -> EvaluationResult` returning verdict + audit trail of every rule evaluation.
      - Helper rule builders: `build_range_rule`, `build_required_field_rule`, `build_allowed_values_rule`, `build_forbidden_phrase_rule` (the last is new — needed for AI-authored prose).
      - `wrap_tool_output(handler, policy)` decorator: takes an MCP tool handler, wraps the response through the engine, returns either the original output (APPROVED), the output with a `_guardrail_flags` field (FLAGGED), or a structured error JSON (REJECTED). All cases call A1's audit chain to record the rule evaluations.

      Tests: every severity path; audit-trail-records-every-evaluation property; REJECTED short-circuits downstream behaviour; FLAGGED preserves output with annotation.
    branch: "feat/L5-output-guardrail-engine"
    depends_on: ["A1"]

  - id: A3
    title: "L6 foundation — Groundedness checker"
    layer: 6
    paper_section: "§9.3"
    evidence_tier: "Industry practice, published case studies. Widely deployed; groundedness checking less common."
    evidence_tier_label: "evidence-tier-strongest"
    scope: |
      New module `packages/pm-mcp-servers/src/pm_mcp_servers/_groundedness/`. Implements paper §9.3 reference.

      - `compute_groundedness(answer: str, sources: list[dict]) -> GroundednessResult` returning `overall_score`, `grounded: bool`, `ungrounded_terms: list[str]`, `per_source_citation_scores: dict`, `provenance_trail: str`.
      - Token overlap with stop-word removal (matches paper). Stop-word list lifted from `pm-mcp-servers/_data/stopwords_en.txt` (new).
      - Threshold tunable, default 0.7 from paper.

      Tests: GROUNDED on faithful citations; UNGROUNDED on hallucination scenario (the paper's Scenario 2); per-source scores attribute correctly; ungrounded-terms list extracted correctly.
    branch: "feat/L6-groundedness-checker"
    depends_on: []

  - id: A4
    title: "L4 foundation — Calibration and conformal-prediction primitives"
    layer: 4
    paper_section: "§7.3"
    evidence_tier: "Peer-reviewed (Guo et al. 2017; Angelopoulos & Bates 2023; Shahbazi et al. 2026). Active research, growing production adoption."
    evidence_tier_label: "evidence-tier-peer-reviewed"
    scope: |
      New module `packages/agent-task-planning/src/agent_planning/calibration/`. Conformal prediction implemented from scratch (matches paper's reference for transparency).

      - `compute_ece(y_true, y_probs, n_bins=15) -> ECEResult` with reliability-diagram bin data.
      - `find_temperature(logits, y_true) -> float` (temperature scaling).
      - `apply_temperature_scaling(logits, T)`.
      - `calibrate_conformal(y_cal, probs_cal, alpha=0.1) -> float` (returns conformal threshold).
      - `conformal_predict(probs, q_hat) -> list[set]` (returns prediction sets).
      - `evaluate_coverage(y_true, prediction_sets) -> float`.
      - `conformal_predict_band(point_estimate, calibration_residuals, alpha=0.2) -> tuple[float, float]` — for the Monte Carlo / benchmark-percentile use case where there's a single point estimate and a history of residuals.

      Dependencies: `numpy`, `scipy`, `scikit-learn` (already in the platform).

      Tests: paper's `test_empirical_coverage_meets_guarantee_alpha_01` (90% nominal → ≥88% empirical on synthetic split); temperature-scaling-reduces-ECE; ECE-on-perfectly-calibrated-data-is-zero.
    branch: "feat/L4-calibration-and-conformal-primitives"
    depends_on: []

  - id: A5
    title: "L2 foundation — Four-tier escalation router with OR fail-safe"
    layer: 2
    paper_section: "§5.3"
    evidence_tier: "Production code (PDA Platform). Proven in production. No dependencies."
    evidence_tier_label: "evidence-tier-strongest"
    scope: |
      New module `packages/agent-task-planning/src/agent_planning/escalation/`. Lifts paper's §5.3 reference.

      - `EscalationLevel` enum (`EXPERT_REQUIRED`, `DETAILED_REVIEW`, `SPOT_CHECK`, `NONE`).
      - `route(values, confidence) -> RoutingDecision` with the **OR-condition fail-safe**: outliers OR low confidence each independently trigger escalation.
      - Reuses existing `compute_iqr` and `detect_numeric_outliers` from `confidence/aggregation.py`.
      - Adds plain-English `reason` strings to each outlier flag (paper-grade behaviour the current implementation lacks).
      - Configurable thresholds (defaults match paper: 0.4, 0.6, 0.8).

      Tests: every routing path; OR-condition (perfect confidence + outlier still routes to EXPERT_REQUIRED); boundary values; reason strings present on all outlier flags.
    branch: "feat/L2-escalation-router"
    depends_on: []

  - id: A6
    title: "L3 foundation — Quality-score and potential-hallucinations primitives"
    layer: 3
    paper_section: "§6.3"
    evidence_tier: "Production code (PDA Platform). Proven in production. No dependencies."
    evidence_tier_label: "evidence-tier-strongest"
    scope: |
      New module `packages/agent-task-planning/src/agent_planning/quality/`. Lifts paper's §6.3 reference.

      - `compute_quality_score(coherence, relevance, completeness, semantic_entropy) -> QualityScore`.
      - Formula matches paper exactly: weights 0.4/0.4/0.2, entropy penalty `max(0, entropy - 0.5) * 0.5`.
      - `flag_potential_hallucinations(samples, threshold=0.7) -> list[str]`.
      - `compute_pass_rate(samples) -> float`.

      Tests: entropy-below-0.5-no-penalty; max-entropy-penalty-is-quarter; high-entropy-pushes-borderline-below-threshold; strict-greater-than at the flag boundary.
    branch: "feat/L3-quality-score-and-hallucinations"
    depends_on: []

  - id: A7
    title: "L7 foundation — RedTeam harness"
    layer: 7
    paper_section: "§10.3"
    evidence_tier: "Published research (CART, EchoGram, PyRIT). Active research, tooling maturing. No dependencies."
    evidence_tier_label: "evidence-tier-published-research"
    scope: |
      New module `packages/pm-mcp-servers/src/pm_mcp_servers/_redteam/`. Lifts paper's §10.3 reference.

      - `PolicyRule`, `TestCase`, `FindingSeverity` (`CRITICAL`/`HIGH`/`MEDIUM`/`LOW`/`NONE`).
      - `RedTeamHarness(system_under_test, policy)` with `run_suite(tests) -> Report`.
      - Forbidden-pattern matching (case-insensitive substring; transparent and auditable per paper §10.5).
      - Exception capture (a crashing system is a finding, not a harness failure).
      - Aggregation: pass rate, findings by severity, findings by category.

      Tests: baseline-passes; violation-detected-at-correct-severity; exception-captured-not-thrown; aggregation correct.
    branch: "feat/L7-redteam-harness"
    depends_on: []

  - id: A8
    title: "L9 foundation — Confidence→RAG monotonicity verification kernel"
    layer: 9
    paper_section: "§12.3"
    evidence_tier: "Peer-reviewed (SMT verification, Constrained AI). Research stage for neural networks; production for small critical components."
    evidence_tier_label: "evidence-tier-peer-reviewed"
    scope: |
      New module `packages/agent-task-planning/src/agent_planning/verified/`. Single formally-verified property: the mapping from confidence score (0.0–1.0) to RAG (`RED`/`AMBER`/`GREEN`) is monotone non-decreasing. Currently this property is encoded implicitly across many tools; Z3 formalises and proves it.

      - Encode the mapping as constraints in Z3 (`if conf < 40: RED; elif conf < 70: AMBER; else: GREEN` — current thresholds from pm-assumptions).
      - Prove: for all `c1, c2` in `[0, 1]`, `c1 <= c2 ⇒ rag_value(c1) <= rag_value(c2)` where `RED < AMBER < GREEN`.
      - Provide a `verify_rag_mapping(rag_function) -> ProofResult` that any module's local RAG mapping can be passed through; returns PROVEN or a counterexample.

      Dependency: `z3-solver` (new — must be added to pyproject.toml).

      Tests: built-in mapping verifies; deliberately-broken mapping returns counterexample; `verify_rag_mapping` callable from external module.
    branch: "feat/L9-monotonicity-kernel"
    depends_on: []

